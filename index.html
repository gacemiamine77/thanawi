<style>
:root{
  --bg:#f2f6f3;--card:#ffffff;--text:#15241b;--muted:#5d6f64;--primary:#0b6b3a;--primary2:#095a30;
  --accent:#f4b41a;--red:#c8322b;--border:#dbe5de;--sol:#eaf5ee;--shadow:0 2px 10px rgba(11,60,35,.08);
  --radius:12px;
}
[data-theme="dark"]{--bg:#0c1410;--card:#14211a;--text:#e7f0ea;--muted:#9db3a6;--primary:#3fc982;--primary2:#3fc982;--border:#24382d;--sol:#122a1e;--shadow:0 2px 10px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,Inter,Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
[dir="ltr"] body{font-family:Inter,Tajawal,Tahoma,sans-serif}
a{color:var(--primary)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1120px;margin:auto;padding:0 1rem}

/* ---- barre supérieure ---- */
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.topbar .wrap{display:flex;align-items:center;gap:.8rem;padding-top:.45rem;padding-bottom:.45rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--text);font-weight:800;font-size:1.25rem}
.logo .mark{width:38px;height:38px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:1.15rem}
.logo small{display:block;font-weight:500;font-size:.68rem;color:var(--muted);line-height:1.2}
nav.main{display:flex;gap:.25rem;margin-inline-start:auto;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--text);padding:.4rem .7rem;border-radius:8px;font-weight:600;font-size:.95rem}
nav.main a:hover,nav.main a.on{background:var(--sol);color:var(--primary)}
.tools{display:flex;gap:.35rem;align-items:center}
.langbtn,.iconbtn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:.35rem .6rem;font-weight:700;font-size:.85rem}
.langbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ---- hero ---- */
.hero{background:linear-gradient(135deg,var(--primary) 0%,#128a4c 60%,#17a55c 100%);color:#fff;padding:2.6rem 0 2.2rem}
.hero h1{margin:0 0 .4rem;font-size:clamp(1.7rem,4.5vw,2.7rem);font-weight:800;line-height:1.35}
.hero p{margin:0;opacity:.94;max-width:720px}
.hero .search{display:flex;gap:.5rem;margin-top:1.2rem;max-width:640px}
.hero .search input{flex:1;padding:.75rem 1rem;border:0;border-radius:10px;font:inherit;color:#15241b}
.hero .search button{background:var(--accent);border:0;border-radius:10px;padding:.75rem 1.3rem;font-weight:800;color:#3a2a00}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:1rem}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:.3rem .85rem;font-weight:700;font-size:.88rem;text-decoration:none}
.chip:hover{background:rgba(255,255,255,.28)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin:-1.1rem 0 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5rem;color:var(--primary);line-height:1.2}
.stat span{color:var(--muted);font-size:.88rem}
.bac{margin-top:.7rem;background:linear-gradient(90deg,#7c2d12,#c2410c);color:#fff;border-radius:var(--radius);padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.bac b{font-size:1.15rem}

/* ---- sections & cartes ---- */
main{padding:1.4rem 0 3rem}
h2.sec{font-size:1.3rem;margin:1.8rem 0 .8rem;display:flex;align-items:center;gap:.5rem}
h2.sec::before{content:"";width:5px;height:1.3em;background:var(--primary);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.85rem}
.levelcard,.subjcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.levelcard:hover,.subjcard:hover{transform:translateY(-2px);border-color:var(--primary)}
.levelcard b{font-size:1.1rem}
.levelcard .n{font-size:2rem;font-weight:800;color:var(--primary);line-height:1}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.subjcard{text-align:center;padding:.9rem .5rem}
.subjcard .ic{font-size:1.7rem}
.subjcard b{display:block;font-size:.95rem}
.subjcard small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.45rem;position:relative}
.card .stripe{position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;border-radius:var(--radius) 0 0 var(--radius)}
[dir="rtl"] .card .stripe{border-radius:0 var(--radius) var(--radius) 0}
.badges{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.badge{font-size:.72rem;font-weight:800;border-radius:99px;padding:.12rem .55rem;background:var(--sol);color:var(--primary);border:1px solid var(--border)}
.badge.fmt{background:#eef2ff;color:#3730a3}
[data-theme="dark"] .badge.fmt{background:#1e2440;color:#a5b4fc}
.badge.exam{background:#fdecec;color:var(--red)}
.badge.lang{background:transparent;color:var(--muted)}
.badge.hasol{background:#fff7e0;color:#92600a}
[data-theme="dark"] .badge.hasol{background:#33270a;color:#f4b41a}
.card h3{margin:0;font-size:1.02rem;line-height:1.55}
.card h3 a{color:var(--text);text-decoration:none}
.card h3 a:hover{color:var(--primary)}
.card .meta{color:var(--muted);font-size:.85rem}
.card .desc{color:var(--muted);font-size:.9rem;margin:0}
.card .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto;padding-top:.5rem}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:.45rem .8rem;font-weight:700;font-size:.88rem;text-decoration:none}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.pri:hover{background:var(--primary2);color:#fff}
.btn.dl{background:var(--sol);color:var(--primary)}
.favbtn{position:absolute;inset-inline-end:.55rem;top:.55rem;border:0;background:transparent;font-size:1.25rem;color:#c8b86a;line-height:1;padding:.2rem}
.doneflag{color:var(--primary);font-weight:800;font-size:.8rem}

/* ---- filtres ---- */
.filters{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:1rem}
.filters input[type=search]{flex:2 1 220px}
.filters select,.filters input{padding:.6rem .7rem;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;font-size:.93rem}
.filters select{flex:1 1 150px}
.results{color:var(--muted);margin:.2rem 0 .8rem;font-size:.92rem}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem;background:var(--card);border:1px dashed var(--border);border-radius:var(--radius)}
.empty .big{font-size:2.4rem}

/* ---- visionneuse ---- */
.viewer-head{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow)}
.viewer-head h1{margin:.4rem 0 .3rem;font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.5}
.viewer-head .meta{color:var(--muted)}
.frame{margin-top:1rem;background:#000;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.frame iframe,.frame video{width:100%;display:block;border:0}
.frame iframe{height:min(78vh,720px);background:#fff}
.frame .ratio{aspect-ratio:16/9}
.frame .ratio iframe{height:100%}
.lesson{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem;margin-top:1rem;box-shadow:var(--shadow);font-size:1.03rem}
.lesson h3{color:var(--primary);margin:1.3rem 0 .4rem;font-size:1.15rem}
.lesson h3:first-child{margin-top:0}
.lesson .bx{background:var(--sol);border:1px solid var(--border);border-inline-start:4px solid var(--primary);border-radius:8px;padding:.7rem .9rem;margin:.6rem 0}
.lesson .bx.solbox{border-inline-start-color:var(--accent);background:#fffaf0}
[data-theme="dark"] .lesson .bx.solbox{background:#241c08}
.solwrap{margin-top:1rem}
.solbody{display:none}
.solbody.open{display:block}
.bigext{display:grid;place-items:center;text-align:center;gap:.6rem;background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);padding:2rem 1rem;margin-top:1rem}
.bigext .big{font-size:2.6rem}
.crumb{color:var(--muted);font-size:.9rem;margin-bottom:.8rem}
.crumb a{text-decoration:none}
.related{margin-top:1.6rem}

/* ---- conseils ---- */
.tip{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;box-shadow:var(--shadow)}
.tip h3{margin:.2rem 0 .4rem;color:var(--primary)}
.tip p{margin:0;color:var(--muted)}
table.cmp{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:.93rem}
table.cmp th,table.cmp td{border-bottom:1px solid var(--border);padding:.6rem .7rem;text-align:start;vertical-align:top}
table.cmp th{background:var(--sol);color:var(--primary)}
.tablewrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow)}

footer{border-top:1px solid var(--border);background:var(--card);color:var(--muted);padding:1.6rem 0;font-size:.92rem}
footer .wrap{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:space-between}
.toast{position:fixed;bottom:1rem;inset-inline-start:50%;transform:translateX(50%);background:var(--text);color:var(--bg);padding:.6rem 1.1rem;border-radius:99px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
[dir="ltr"] .toast{transform:translateX(-50%)}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.load{text-align:center;padding:3rem;color:var(--muted)}

@media print{
  .topbar,.hero,.filters,footer,.acts,.no-print,.bac,.stats,.related,.favbtn{display:none!important}
  body{background:#fff;color:#000}
  .solbody{display:block!important}
  .lesson,.viewer-head{border:0;box-shadow:none}
}
</style>

function fmtOf(it){
  if(it.format)return it.format;
  const u=(it.url||"").toLowerCase();
  if(/youtu\.?be/.test(u))return"youtube";
  const m=u.match(/\.([a-z0-9]+)(\?|#|$)/); if(m)return m[1];
  return it.body?"html":"link";
}
function ytId(u){const m=String(u||"").match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:null}
const isFile=it=>it.url&&!ytId(it.url)&&!["html","youtube"].includes(fmtOf(it));
const hasSol=it=>!!(it.solution||it.solutionUrl);

function applyTheme(){const saved=localStorage.getItem("thanawi-theme");const dark=saved?saved==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=dark?"dark":"light";$("#themeBtn").textContent=dark?"☀️":"🌙"}
$("#themeBtn").onclick=()=>{const d=document.documentElement.dataset.theme!=="dark";localStorage.setItem("thanawi-theme",d?"dark":"light");applyTheme()};
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  $$(".langbtn").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  $$("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.title="Thanawi — "+t("tagline");
}
$$(".langbtn").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;localStorage.setItem("thanawi-lang",LANG);applyLang();render()});

function bindFavs(root){
  root.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.fav;

    if(location.hash.startsWith("#/favorites"))render();
  });
}

function parseHash(){
  const h=location.hash.replace(/^#\/?/,"");
  const [path,qs]=h.split("?");
  const parts=path.split("/").filter(Boolean);
  return {parts,params:new URLSearchParams(qs||"")};
}

function filterItems(p){
  const q=(p.get("q")||"").trim().toLowerCase();
  let list=DB.items.filter(it=>{
    if(p.get("level")&&it.level!==p.get("level"))return false;
    if(p.get("stream")&&it.stream!=="all"&&it.stream!==p.get("stream"))return false;
    if(p.get("subject")&&it.subject!==p.get("subject"))return false;
    if(p.get("type")&&it.type!==p.get("type"))return false;
    if(p.get("format")&&fmtOf(it)!==p.get("format"))return false;
    if(p.get("lang")&&(it.lang||"ar")!==p.get("lang"))return false;
    if(q){const hay=(it.title+" "+(it.chapter||"")+" "+(it.desc||"")+" "+subjName(it.subject)).toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
  if(p.get("sort")==="title")list.sort((a,b)=>a.title.localeCompare(b.title));
  else list.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return list;
}
function resultsHTML(list){
  if(!list.length)return `<div class="empty"><div class="big">🔍</div><b>${t("noRes")}</b><p>${t("noResP")}</p></div>`;
  return `<div class="results">${list.length} ${t("found")}</div><div class="grid">${list.map(cardHTML).join("")}</div>`;
}

function viewItem(it,openSol){
  const f=fmtOf(it),s=subj(it.subject),vid=ytId(it.url);
  let media="";
  if(it.type==="video"||f==="youtube"||f==="mp4"){
    if(vid)media=`<div class="frame"><div class="ratio"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" title="${esc(it.title)}" allowfullscreen loading="lazy"></iframe></div></div>`;
    else if(f==="mp4")media=`<div class="frame"><video src="${esc(it.url)}" controls preload="metadata"></video></div>`;
    else if(it.url)media=`<div class="bigext"><div class="big">🎬</div><p>${t("extNote")}</p><a class="btn pri" href="${esc(it.url)}" target="_blank" rel="noopener">${t("extWatch")}</a></div>`;
  }else if(f==="pdf"&&it.url){
    media=`<div class="frame"><iframe src="${esc(it.url)}" title="${esc(it.title)}"></iframe></div>`;
  }else if(it.url&&f!=="html"){
    media=`<div class="bigext"><div class="big">${f==="epub"?"📖":f==="docx"||f==="doc"?"📝":"📄"}</div><p>${t("noPreview")}</p><a class="btn pri" href="${esc(it.url)}" download>${t("dlFile")} (${esc(t("fmt_"+f))}${it.size?" · "+esc(it.size):""})</a></div>`;
  }
  const related=DB.items.filter(x=>x.id!==it.id&&x.subject===it.subject&&(x.level===it.level||x.chapter&&x.chapter===it.chapter)).slice(0,3);
  return `<main class="wrap">
    <div class="crumb"><a href="#/">${t("home")}</a> / <a href="#/library">${t("navLib")}</a> / <a href="#/library?subject=${esc(it.subject)}">${esc(subjName(it.subject))}</a></div>
    <div class="viewer-head">
      <div class="badges">
        <span class="badge ${it.type==="exam"?"exam":""}">${esc(t("type_"+it.type))}</span>
        <span class="badge fmt">${esc(t("fmt_"+f))}</span>
        ${hasSol(it)?`<span class="badge hasol">${t("withSol")}</span>`:""}
      </div>
      <h1>${esc(it.title)}</h1>
      ${it.desc?`<p style="color:var(--muted);margin:.2rem 0">${esc(it.desc)}</p>`:""}
      <div class="meta">
        ${esc(s.icon)} ${t("subject")}: <b>${esc(subjName(it.subject))}</b> ·
        ${t("level")}: <b>${esc(levelName(it.level))}</b>${it.stream&&it.stream!=="all"?` (${esc(streamName(it.stream))})`:""}
        ${it.chapter?`· ${t("chapter")}: <b>${esc(it.chapter)}</b>`:""}
        ${it.size?`· ${t("size")}: ${esc(it.size)}`:""}${it.duration?`· ${t("dur")}: ${esc(it.duration)}`:""}${it.date?`· ${t("date")}: ${esc(it.date)}`:""}
      </div>
      <div class="acts" style="display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.9rem">
        ${isFile(it)?`<a class="btn dl" href="${esc(it.url)}" download>⬇ ${t("download")} (${esc(t("fmt_"+f))})</a>`:""}
        <button class="btn" id="doneBtn">${done.has(it.id)?t("done"):t("markDone")}</button>
        <button class="btn" id="favBtn">${favs.has(it.id)?"★":"☆"} ${t("navFav")}</button>
        <button class="btn" id="shareBtn">${t("share")}</button>
        <button class="btn" onclick="window.print()">${t("print")}</button>
      </div>
    </div>
    ${media}
    ${it.body?`<article class="lesson" lang="${esc(it.lang||"ar")}" dir="${(it.lang||"ar")==="ar"?"rtl":"ltr"}">${it.body}</article>`:""}
    ${hasSol(it)?`<div class="solwrap">
      <button class="btn pri" id="solBtn" aria-expanded="${openSol?"true":"false"}">${openSol?t("hideSol"):t("showSol")}</button>
      <div class="solbody ${openSol?"open":""}" id="solBody">
        ${it.solution?`<article class="lesson" lang="${esc(it.lang||"ar")}" dir="${(it.lang||"ar")==="ar"?"rtl":"ltr"}"><h3 style="margin-top:0">✓ ${t("solTitle")}</h3>${it.solution}</article>`:""}
        ${it.solutionUrl?`<div class="bigext"><div class="big">✅</div><a class="btn pri" href="${esc(it.solutionUrl)}" download>${t("dlSol")}</a><a class="btn" href="${esc(it.solutionUrl)}" target="_blank" rel="noopener">${t("open")}</a></div>`:""}
      </div></div>`:""}
    ${related.length?`<div class="related"><h2 class="sec">${t("related")}</h2><div class="grid">${related.map(cardHTML).join("")}</div></div>`:""}
    <p class="no-print" style="margin-top:1.4rem"><a class="btn" href="#/library">${t("back")}</a></p>
  </main>`;
}

function viewFavorites(){
  const list=DB.items.filter(i=>favs.has(i.id));
  return `<main class="wrap"><h2 class="sec">${t("favT")}</h2>
  ${list.length?`<p style="color:var(--muted)">${done.size} ${t("progDone")} ${DB.items.length}</p><div class="grid">${list.map(cardHTML).join("")}</div>`
  :`<div class="empty"><div class="big">⭐</div><p>${t("favEmpty")}</p></div>`}</main>`;
}

function viewTips(){
  return `<main class="wrap">
  <h2 class="sec">${t("tipsT")}</h2>
  <div class="grid">${TIPS[LANG].map(x=>`<div class="tip"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join("")}</div>
  <h2 class="sec">${t("sitesT")}</h2>
  <p style="color:var(--muted)">${t("sitesP")}</p>
  <div class="tablewrap"><table class="cmp"><thead><tr><th>${t("colSite")}</th><th>${t("colUse")}</th><th>${t("colIdea")}</th></tr></thead>
  <tbody>${SITES.map(s=>`<tr><td><a href="${esc(s[1])}" target="_blank" rel="noopener"><b>${esc(s[0])}</b></a></td><td>${esc(s[2][LANG]||s[2].fr)}</td><td>${esc(s[3][LANG]||s[3].fr)}</td></tr>`).join("")}</tbody></table></div>
  </main>`;
}

/* ================= Routeur ================= */
function render(){
  if(!DB)return;
  const {parts,params}=parseHash();
  const route=parts[0]||"";
  $$("nav.main a").forEach(a=>a.classList.toggle("on",a.dataset.nav===(route||"home")));
  const app=$("#app");
  if(route===""||route==="home"){
    app.innerHTML=viewHome();bindFavs(app);
    const f=$("#homeSearch");
    if(f)f.onsubmit=e=>{e.preventDefault();location.hash="#/library?q="+encodeURIComponent($("#hs").value.trim())};
  }else if(route==="library"){
    app.innerHTML=viewLibrary(params);
    const form=$("#filters"),box=$("#libResults");
    const upd=()=>{const p=new URLSearchParams(new FormData(form));for(const[k,v]of[...p])if(!v)p.delete(k);box.innerHTML=resultsHTML(filterItems(p));bindFavs(box);history.replaceState(null,"","#/library"+(p.toString()?"?"+p:""))};
    form.addEventListener("input",upd);form.addEventListener("change",upd);form.onsubmit=e=>e.preventDefault();
    $("#resetF").onclick=()=>{form.reset();upd()};
    box.innerHTML=resultsHTML(filterItems(params));bindFavs(box);
  }else if(route==="item"&&parts[1]){
    const it=DB.items.find(x=>x.id===decodeURIComponent(parts[1]));
    if(!it){app.innerHTML=viewLibrary(params);render();return}
    app.innerHTML=viewItem(it,params.get("sol")==="1");bindFavs(app);
    const sb=$("#solBtn");
    if(sb)sb.onclick=()=>{const b=$("#solBody");const open=b.classList.toggle("open");sb.textContent=open?t("hideSol"):t("showSol");sb.setAttribute("aria-expanded",open)};
    const db2=$("#doneBtn");
    if(db2)db2.onclick=()=>{done.has(it.id)?done.delete(it.id):done.add(it.id);saveSets();db2.textContent=done.has(it.id)?t("done"):t("markDone")};
    const fb=$("#favBtn");
    if(fb)fb.onclick=()=>{if(favs.has(it.id)){favs.delete(it.id);toast(t("favDel"))}else{favs.add(it.id);toast(t("favAdd"))}saveSets();fb.textContent=(favs.has(it.id)?"★":"☆")+" "+t("navFav")};
    const sh=$("#shareBtn");
    if(sh)sh.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast(t("copied"))}catch(e){prompt("",location.href)}};
  }else if(route==="favorites"){
    app.innerHTML=viewFavorites();bindFavs(app);
  }else if(route==="tips"){
    app.innerHTML=viewTips();
  }else{
    app.innerHTML=viewHome();bindFavs(app);
  }
  window.scrollTo({top:0});
}
addEventListener("hashchange",render);

/* ================= Démarrage ================= */
applyTheme();applyLang();
fetch("data/content.json?t="+Date.now())
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(db=>{DB=db;render()})
  .catch(()=>{$("#app").innerHTML=`<main class="wrap"><div class="empty"><div class="big">⚠️</div><p>${t("errLoad")}</p></div></main>`});
</script>
</body>
</html>
